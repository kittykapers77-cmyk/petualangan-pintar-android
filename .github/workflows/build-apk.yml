
name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file repository
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

        uses: android-actions/setup-android@v3

      - name: Ekstrak proyek ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name: Terima lisensi dan siapkan SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Siapkan debug keystore
        working-directory: android-project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Bangun APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK hasil build
        uses: actions/upload-artifact@v4
        with:
          name: petualangan-pintar-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
